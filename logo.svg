<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <!-- Background (#0c6838) -->
  <rect width="320" height="220" rx="20" fill="#0c6838" stroke="#facc15" stroke-width="4"/>
  
  <!-- HACKER HOUSE Yellow Serif Text -->
  <text x="160" y="85" text-anchor="middle" fill="#facc15" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="48" letter-spacing="3">HACKER</text>
  <text x="160" y="155" text-anchor="middle" fill="#facc15" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="56" letter-spacing="2">HOUSE</text>
  
  <!-- Hot Pink Sticker (#ff007a) with white outline -->
  <g transform="rotate(-4 160 108)">
    <rect x="95" y="80" width="130" height="56" rx="12" fill="#ff007a" stroke="#ffffff" stroke-width="4.5"/>
    <!-- White Devanagari text "गोवा" inside pink sticker -->
    <text x="160" y="121" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36">गोवा</text>
  </g>
</svg>
